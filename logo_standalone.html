<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXELGEAR — Minecraft Pixel Logo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #22c55e;
            --green-deep: #16a34a;
            --cyan: #06b6d4;
            --dark: #0b1220;
            --light: #f9fafb;
            --charge: #ff3b3b;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background:
                radial-gradient(circle at 50% 30%, rgba(34,197,94,0.10), transparent 60%),
                radial-gradient(circle at 50% 80%, rgba(6,182,212,0.10), transparent 60%),
                var(--dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 40px;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
        }

        /* Animated blocky grid floor (Minecraft vibe) */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(34,197,94,0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6,182,212,0.06) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: linear-gradient(transparent, #000 60%);
            animation: grid-pan 12s linear infinite;
            pointer-events: none;
        }
        @keyframes grid-pan {
            from { background-position: 0 0, 0 0; }
            to   { background-position: 40px 40px, 40px 40px; }
        }

        .stage {
            position: relative;
            padding: 60px;
            display: grid;
            place-items: center;
        }

        /* ===================== LOGO ===================== */
        .mc-logo {
            --px: 9px;
            display: inline-flex;
            align-items: center;
            gap: 22px;
            text-decoration: none;
            cursor: pointer;
            position: relative;
            padding: 18px 26px;
            animation: logo-float 5s var(--ease) infinite;
            isolation: isolate;
        }
        @keyframes logo-float {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-8px); }
        }

        /* ---- Pixel creeper icon ---- */
        .mc-logo__icon {
            --cols: 8;
            display: grid;
            grid-template-columns: repeat(var(--cols), var(--px));
            grid-auto-rows: var(--px);
            filter: drop-shadow(0 0 10px rgba(34,197,94,0.55));
            transition: transform .4s var(--ease), filter .4s var(--ease);
            animation: icon-bob 3.5s ease-in-out infinite;
        }
        @keyframes icon-bob {
            0%, 100% { transform: translateY(0) rotate(0); }
            50%      { transform: translateY(-4px) rotate(-2deg); }
        }
        .px { width: var(--px); height: var(--px); }
        .px-g { background: var(--green); box-shadow: inset -2px -2px 0 rgba(0,0,0,0.25), inset 2px 2px 0 rgba(255,255,255,0.18); }
        .px-k { background: #0a0f1a; box-shadow: inset -1px -1px 0 rgba(255,255,255,0.06); transition: background .12s linear, box-shadow .12s linear; }
        .px-e { background: transparent; }

        /* charged creeper on hover */
        .mc-logo:hover .mc-logo__icon { filter: drop-shadow(0 0 16px rgba(255,59,59,0.7)); transform: scale(1.06); }
        .mc-logo:hover .px-k {
            background: var(--charge);
            box-shadow: 0 0 8px var(--charge), inset -1px -1px 0 rgba(0,0,0,0.3);
        }
        .mc-logo.charged .px-k {
            background: var(--charge);
            box-shadow: 0 0 10px var(--charge);
        }

        /* ---- Pixel text ---- */
        .mc-logo__text {
            position: relative;
            font-family: 'Press Start 2P', monospace;
            font-size: 30px;
            line-height: 1.1;
            letter-spacing: 2px;
            color: transparent;
            background: linear-gradient(90deg, var(--green) 0%, var(--cyan) 50%, var(--green) 100%);
            background-size: 220% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            text-shadow: 0 0 14px rgba(34,197,94,0.35);
            animation: shimmer 4s linear infinite;
        }
        @keyframes shimmer {
            from { background-position: 220% 0; }
            to   { background-position: -220% 0; }
        }

        /* Glitch RGB split */
        .mc-logo__text::before,
        .mc-logo__text::after {
            content: attr(data-text);
            position: absolute;
            inset: 0;
            background: inherit;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            clip-path: inset(0 0 100% 0);
            opacity: 0;
        }
        .mc-logo__text::before { text-shadow: -2px 0 #ff00c1; }
        .mc-logo__text::after  { text-shadow:  2px 0 var(--cyan); }

        .mc-logo:hover .mc-logo__text { animation: shimmer 4s linear infinite, glitch-skew .4s steps(2) infinite; }
        .mc-logo:hover .mc-logo__text::before { opacity: .9; animation: glitch-top 1.1s steps(8) infinite; }
        .mc-logo:hover .mc-logo__text::after  { opacity: .9; animation: glitch-bot 1.3s steps(8) infinite; }

        @keyframes glitch-skew {
            0%,100% { transform: skewX(0); }
            50%     { transform: skewX(-4deg); }
        }
        @keyframes glitch-top {
            0%,100% { clip-path: inset(0 0 78% 0); transform: translateX(-2px); }
            20% { clip-path: inset(10% 0 55% 0); transform: translateX(2px); }
            40% { clip-path: inset(35% 0 40% 0); transform: translateX(-1px); }
            60% { clip-path: inset(5% 0 70% 0);  transform: translateX(3px); }
            80% { clip-path: inset(50% 0 20% 0); transform: translateX(-2px); }
        }
        @keyframes glitch-bot {
            0%,100% { clip-path: inset(72% 0 0 0); transform: translateX(2px); }
            20% { clip-path: inset(55% 0 10% 0); transform: translateX(-2px); }
            40% { clip-path: inset(40% 0 35% 0); transform: translateX(1px); }
            60% { clip-path: inset(70% 0 5% 0);  transform: translateX(-3px); }
            80% { clip-path: inset(20% 0 55% 0); transform: translateX(2px); }
        }

        /* Scanline CRT overlay */
        .mc-logo::after {
            content: '';
            position: absolute;
            inset: 8px;
            border-radius: 6px;
            background: repeating-linear-gradient(
                to bottom,
                rgba(255,255,255,0.05) 0px,
                rgba(255,255,255,0.05) 1px,
                transparent 1px,
                transparent 4px
            );
            mix-blend-mode: overlay;
            opacity: .5;
            pointer-events: none;
            z-index: 2;
        }

        /* block-break particles */
        .frag {
            position: absolute;
            width: 7px; height: 7px;
            pointer-events: none;
            z-index: 5;
            will-change: transform, opacity;
        }

        .hint {
            color: rgba(249,250,251,0.55);
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="stage">
        <a href="index.php" class="mc-logo" id="logo">
            <span class="mc-logo__icon" aria-hidden="true"></span>
            <span class="mc-logo__text" data-text="PIXELGEAR">PIXELGEAR</span>
        </a>
    </div>
    <p class="hint">Hover để creeper "nạp" &amp; nổ pixel</p>

    <script>
        // Build pixel creeper (8x8). G = green face, K = black features, . = empty
        const FACE = [
            "..GGGG..",
            ".GGGGGG.",
            ".KKGGKK.",
            ".KKGGKK.",
            "GGGGGGGG",
            "GGKKKKGG",
            "GGKKKKGG",
            ".GGGGGG."
        ];
        const icon = document.querySelector('.mc-logo__icon');
        FACE.forEach(row => {
            [...row].forEach(ch => {
                const p = document.createElement('i');
                p.className = 'px ' + (ch === 'G' ? 'px-g' : ch === 'K' ? 'px-k' : 'px-e');
                icon.appendChild(p);
            });
        });

        // Block-break particle burst on hover
        const logo = document.getElementById('logo');
        const COLORS = ['#22c55e', '#06b6d4', '#16a34a', '#f9fafb', '#ff3b3b'];
        function burst() {
            const r = logo.getBoundingClientRect();
            const cx = r.left + r.width * 0.28;
            const cy = r.top + r.height * 0.5;
            for (let i = 0; i < 26; i++) {
                const f = document.createElement('div');
                f.className = 'frag';
                f.style.background = COLORS[i % COLORS.length];
                f.style.left = cx + 'px';
                f.style.top = cy + 'px';
                f.style.boxShadow = '0 0 6px ' + f.style.background;
                document.body.appendChild(f);
                const ang = Math.random() * Math.PI * 2;
                const dist = 40 + Math.random() * 90;
                const dx = Math.cos(ang) * dist;
                const dy = Math.sin(ang) * dist * 0.6 - 30;
                const rot = (Math.random() * 360) | 0;
                f.animate([
                    { transform: 'translate(0,0) rotate(0)', opacity: 1 },
                    { transform: `translate(${dx}px, ${dy + 60}px) rotate(${rot}deg)`, opacity: 0 }
                ], { duration: 700 + Math.random() * 400, easing: 'cubic-bezier(0.16,1,0.3,1)' })
                  .onfinish = () => f.remove();
            }
        }
        logo.addEventListener('mouseenter', burst);
    </script>
</body>
</html>
